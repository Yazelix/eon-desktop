[package]
name = "yazelix-venus"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
accesskit = "=0.24.1"
accesskit_winit = { version = "=0.33.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
eon-workspace-protocol = { git = "https://github.com/Yazelix/eon.git", rev = "4af395aea06c230ee6b18cf0755ae25915c0b88d" }
glyphon = "=0.12.0"
orbit-protocol = { git = "https://github.com/luccahuguet/orbit.git", rev = "9d6d2bb37f20ab4ad9e186c7bc715eabef43e757" }
pollster = { version = "=1.0.1", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "vulkan", "metal", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
