name: Prove macOS native interaction

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venus-macos-native-interaction
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      VENUS_SOURCE: ba93bcf7e103844ddc47a73a7c72ab6a2b06b171
    steps:
      - name: Check out exact Venus candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VENUS_SOURCE }}
          persist-credentials: false

      - name: Check out exact private sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon
          ref: 0cc8f477298681ae3945903e8fdb5852d487c5ab
          path: .proof-deps/eon
          token: ${{ secrets.VENUS_PROOF_READ_TOKEN }}
          persist-credentials: false

      - name: Check out exact Orbit protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon-sessions
          ref: ea9fd28ce0908f218cf65d4e6df368f0a4e565f5
          path: .proof-deps/eon-sessions
          token: ${{ secrets.VENUS_PROOF_READ_TOKEN }}
          persist-credentials: false

      - name: Check out accepted native Orbit runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon-sessions
          ref: 0233f4d34b294a50c5bc7f373859cf4ec04d2414
          path: .proof-deps/eon-sessions-runtime
          token: ${{ secrets.VENUS_PROOF_READ_TOKEN }}
          persist-credentials: false

      - name: Pin exact private dependency sources
        run: |
          test "$(git rev-parse HEAD)" = "$VENUS_SOURCE"
          test "$(git -C .proof-deps/eon rev-parse HEAD)" = 0cc8f477298681ae3945903e8fdb5852d487c5ab
          test "$(git -C .proof-deps/eon-sessions rev-parse HEAD)" = ea9fd28ce0908f218cf65d4e6df368f0a4e565f5
          test "$(git -C .proof-deps/eon-sessions-runtime rev-parse HEAD)" = 0233f4d34b294a50c5bc7f373859cf4ec04d2414
          git config --global url."file://$GITHUB_WORKSPACE/.proof-deps/eon".insteadOf https://github.com/Yazelix/eon.git
          git config --global url."file://$GITHUB_WORKSPACE/.proof-deps/eon-sessions".insteadOf https://github.com/Yazelix/eon-sessions.git

      - name: Install Zig 0.15.2 for Orbit
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          printf '%s  %s\n' \
            '3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b' \
            "$RUNNER_TEMP/zig.tar.xz" | shasum --algorithm 256 --check
          tar --extract --xz --file "$RUNNER_TEMP/zig.tar.xz" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"

      - name: Verify exact Apple candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          rustc --version --verbose
          cargo --version --verbose
          zig version
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 > /dev/null
          cargo tree --locked --target aarch64-apple-darwin > "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F 'arboard v3.6.1' "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F 'objc2-app-kit v0.3.2' "$RUNNER_TEMP/venus-apple-tree.txt"
          if grep -Eq 'wayland-client|wl-clipboard-rs|x11rb' "$RUNNER_TEMP/venus-apple-tree.txt"; then
            exit 1
          fi
          cargo test --locked --bin yazelix-venus
          cargo test --locked --lib input::tests
          cargo test --locked --test canonical_scene
          cargo check --locked --workspace --all-targets --target aarch64-apple-darwin
          cargo build --locked --bin yazelix-venus --target aarch64-apple-darwin

      - name: Build accepted Orbit producer
        run: cargo build --locked --manifest-path .proof-deps/eon-sessions-runtime/Cargo.toml --bin yazelix-orbit

      - name: Build disposable native event driver
        run: |
          cat > "$RUNNER_TEMP/venus-events.swift" <<'SWIFT'
          import Cocoa
          import CoreGraphics

          func source() -> CGEventSource {
            CGEventSource(stateID: .hidSystemState)!
          }

          func postKey(_ pid: pid_t, _ key: CGKeyCode, _ down: Bool, _ flags: CGEventFlags = [], _ text: String? = nil, _ repeatEvent: Bool = false) {
            let event = CGEvent(keyboardEventSource: source(), virtualKey: key, keyDown: down)!
            event.flags = flags
            if let text, down {
              let units = Array(text.utf16)
              units.withUnsafeBufferPointer {
                event.keyboardSetUnicodeString(stringLength: units.count, unicodeString: $0.baseAddress)
              }
            }
            if repeatEvent {
              event.setIntegerValueField(.keyboardEventAutorepeat, value: 1)
            }
            event.postToPid(pid)
            Thread.sleep(forTimeInterval: 0.05)
          }

          func postMouse(_: pid_t, _ type: CGEventType, _ point: CGPoint, _ flags: CGEventFlags = []) {
            let event = CGEvent(mouseEventSource: source(), mouseType: type, mouseCursorPosition: point, mouseButton: .left)!
            event.flags = flags
            event.post(tap: .cghidEventTap)
            Thread.sleep(forTimeInterval: 0.05)
          }

          let args = CommandLine.arguments
          let action = args[1]
          if action == "focus-away" {
            let seconds = Double(args[2])!
            let app = NSApplication.shared
            app.setActivationPolicy(.regular)
            let window = NSWindow(contentRect: NSRect(x: 100, y: 100, width: 240, height: 120), styleMask: [.titled], backing: .buffered, defer: false)
            window.makeKeyAndOrderFront(nil)
            app.activate(ignoringOtherApps: true)
            DispatchQueue.main.asyncAfter(deadline: .now() + seconds) { NSApp.terminate(nil) }
            app.run()
            exit(0)
          }

          let pid = pid_t(args[2])!
          switch action {
          case "activate":
            guard let app = NSRunningApplication(processIdentifier: pid) else { exit(2) }
            app.activate(options: [.activateAllWindows, .activateIgnoringOtherApps])
            Thread.sleep(forTimeInterval: 0.5)
          case "text":
            let key = CGKeyCode(args[3])!
            postKey(pid, key, true, [], args[4])
            postKey(pid, key, false)
          case "repeat":
            let key = CGKeyCode(args[3])!
            let text = args[4]
            postKey(pid, key, true, [], text)
            postKey(pid, key, true, [], text, true)
            postKey(pid, key, false)
          case "shortcut":
            let key = CGKeyCode(args[3])!
            postKey(pid, 55, true, .maskCommand)
            postKey(pid, key, true, .maskCommand)
            postKey(pid, key, false, .maskCommand)
            postKey(pid, 55, false)
          case "move":
            postMouse(pid, .mouseMoved, CGPoint(x: Double(args[3])!, y: Double(args[4])!))
          case "click", "command-click":
            let point = CGPoint(x: Double(args[3])!, y: Double(args[4])!)
            let flags: CGEventFlags = action == "command-click" ? .maskCommand : []
            if action == "command-click" { postKey(pid, 55, true, .maskCommand) }
            postMouse(pid, .mouseMoved, point, flags)
            postMouse(pid, .leftMouseDown, point, flags)
            postMouse(pid, .leftMouseUp, point, flags)
            if action == "command-click" { postKey(pid, 55, false) }
          case "drag":
            let y = Double(args[4])!
            let start = CGPoint(x: Double(args[3])!, y: y)
            let end = CGPoint(x: Double(args[5])!, y: y)
            postMouse(pid, .mouseMoved, start)
            postMouse(pid, .leftMouseDown, start)
            for step in 1...8 {
              let fraction = Double(step) / 8
              postMouse(pid, .leftMouseDragged, CGPoint(x: start.x + (end.x - start.x) * fraction, y: y))
            }
            postMouse(pid, .leftMouseUp, end)
          case "scroll":
            let point = CGPoint(x: Double(args[3])!, y: Double(args[4])!)
            for (phase, delta) in [(1, 180), (4, 180), (8, 0)] {
              let event = CGEvent(scrollWheelEvent2Source: source(), units: .pixel, wheelCount: 1, wheel1: Int32(delta), wheel2: 0, wheel3: 0)!
              event.location = point
              event.setIntegerValueField(.scrollWheelEventIsContinuous, value: 1)
              event.setIntegerValueField(.scrollWheelEventScrollPhase, value: Int64(phase))
              event.postToPid(pid)
              Thread.sleep(forTimeInterval: 0.1)
            }
          default:
            exit(2)
          }
          SWIFT
          swiftc "$RUNNER_TEMP/venus-events.swift" -o "$RUNNER_TEMP/venus-events"

      - name: Exercise pasteboard, input, pointer, scroll, and links
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/venus-interaction"
          install -d -m 700 "$proof_dir"
          uid=$(/usr/bin/id -u)
          socket="/tmp/yazelix-orbit-$uid/orbit.sock"
          start="$proof_dir/start"
          input="$proof_dir/input"
          control="$proof_dir/control"
          log="$proof_dir/venus.log"
          http_log="$proof_dir/http.log"
          uri='http://127.0.0.1:8765/venus-proof?source=venus'
          orbit=.proof-deps/eon-sessions-runtime/target/debug/yazelix-orbit
          venus=target/aarch64-apple-darwin/debug/yazelix-venus
          events="$RUNNER_TEMP/venus-events"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$http_log" 2>&1 &
          http_pid=$!
          # shellcheck disable=SC2016
          PROOF_START="$start" PROOF_INPUT="$input" PROOF_URI="$uri" \
            /usr/bin/env -u UID -u XDG_RUNTIME_DIR "$orbit" serve -- /bin/sh -c '
              while test ! -e "$PROOF_START"; do sleep 0.1; done
              row=1
              while test "$row" -le 60; do
                printf "\033]8;;%s\033\\" "$PROOF_URI"
                printf "LINK-%02d-" "$row"
                column=1
                while test "$column" -le 70; do printf L; column=$((column + 1)); done
                printf "\033]8;;\033\\\r\n"
                row=$((row + 1))
              done
              printf "\033]52;c;dGVybWluYWwtY2xpcGJvYXJkLcOp55WM\a\033[?25l"
              stty raw -echo
              dd of="$PROOF_INPUT" bs=1 count=20 2>/dev/null
              exec /bin/sleep 300
            ' &
          orbit_pid=$!
          control_pid=
          venus_pid=
          away_pid=
          cleanup() {
            test -z "$away_pid" || kill "$away_pid" 2>/dev/null || true
            test -z "$control_pid" || kill "$control_pid" 2>/dev/null || true
            test -z "$venus_pid" || kill "$venus_pid" 2>/dev/null || true
            kill "$orbit_pid" "$http_pid" 2>/dev/null || true
            wait "$orbit_pid" 2>/dev/null || true
            wait "$http_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            test -S "$socket" && break
            kill -0 "$orbit_pid"
            sleep 1
          done
          test -S "$socket"
          mkfifo "$control"
          sleep 300 > "$control" &
          control_pid=$!
          /usr/bin/env -u UID -u XDG_RUNTIME_DIR EON_VENUS_PRESENTATION_CONTROL=stdin-ready-v1 \
            "$venus" --columns 84 --rows 27 < "$control" > "$log" 2>&1 &
          venus_pid=$!
          for _ in {1..30}; do
            grep -Fq ready-v1 "$log" && break
            kill -0 "$venus_pid"
            sleep 1
          done
          grep -Fq ready-v1 "$log"
          sleep 2
          touch "$start"

          for _ in {1..30}; do
            if test "$(/usr/bin/pbpaste 2>/dev/null || true)" = 'terminal-clipboard-é界'; then break; fi
            kill -0 "$venus_pid"
            sleep 1
          done
          test "$(/usr/bin/pbpaste)" = 'terminal-clipboard-é界'

          # shellcheck disable=SC2016
          window_info=$(VENUS_PID="$venus_pid" swift -e 'import CoreGraphics; import Foundation; let pid = Int32(ProcessInfo.processInfo.environment["VENUS_PID"]!)!; let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)! as! [[String: Any]]; guard let window = windows.first(where: { ($0[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == pid && ($0[kCGWindowLayer as String] as? NSNumber)?.intValue == 0 }), let number = window[kCGWindowNumber as String] as? NSNumber, let boundsValue = window[kCGWindowBounds as String] as? NSDictionary, let bounds = CGRect(dictionaryRepresentation: boundsValue) else { exit(2) }; print(number.intValue, Int(bounds.midX), Int(bounds.midY), Int(bounds.minX + bounds.width * 0.30), Int(bounds.minX + bounds.width * 0.70), Int(bounds.maxY - 10))')
          read -r window_id center_x center_y drag_x1 drag_x2 notice_y <<< "$window_info"
          test -n "$window_id"
          screencapture -x -l "$window_id" "$proof_dir/initial.png"

          "$events" move "$venus_pid" "$center_x" "$center_y"
          sleep 1
          "$events" shortcut "$venus_pid" 8
          sleep 1
          test "$(/usr/bin/pbpaste)" = "$uri"

          "$events" scroll "$venus_pid" "$center_x" "$center_y"
          sleep 2
          screencapture -x -l "$window_id" "$proof_dir/scrolled.png"
          kill -0 "$venus_pid"

          "$events" drag "$venus_pid" "$drag_x1" "$center_y" "$drag_x2"
          sleep 1
          "$events" move "$venus_pid" "$center_x" "$notice_y"
          screencapture -x -l "$window_id" "$proof_dir/selection.png"
          "$events" shortcut "$venus_pid" 8
          sleep 1
          /usr/bin/pbpaste > "$proof_dir/selection.txt"
          test -s "$proof_dir/selection.txt"
          test "$(cat "$proof_dir/selection.txt")" != "$uri"
          grep -Eq 'LINK|LLLL' "$proof_dir/selection.txt"
          swift -e 'import AppKit; NSPasteboard.general.clearContents()'
          "$events" shortcut "$venus_pid" 9
          sleep 1
          test ! -s "$input"
          screencapture -x -l "$window_id" "$proof_dir/empty-paste.png"

          swift -e 'import AppKit; let p = NSPasteboard.general; p.clearContents(); precondition(p.setData(Data([0x89, 0x50, 0x4e, 0x47]), forType: .png))'
          "$events" shortcut "$venus_pid" 9
          sleep 1
          test ! -s "$input"
          screencapture -x -l "$window_id" "$proof_dir/non-text-paste.png"

          swift -e 'import AppKit; let p = NSPasteboard.general; p.clearContents(); precondition(p.setString(String(repeating: "x", count: 1_048_577), forType: .string))'
          "$events" shortcut "$venus_pid" 9
          sleep 1
          test ! -s "$input"
          screencapture -x -l "$window_id" "$proof_dir/oversize-paste.png"

          "$events" focus-away 4 > /dev/null 2>&1 &
          away_pid=$!
          sleep 1
          "$events" text "$venus_pid" 7 X
          sleep 1
          test ! -s "$input"
          wait "$away_pid"
          away_pid=
          "$events" activate "$venus_pid"

          PASTE_VALUE=$'paste-é界\n' swift -e 'import AppKit; import Foundation; let p = NSPasteboard.general; p.clearContents(); precondition(p.setString(ProcessInfo.processInfo.environment["PASTE_VALUE"]!, forType: .string))'
          "$events" text "$venus_pid" 0 A
          "$events" text "$venus_pid" 0 'é界'
          "$events" repeat "$venus_pid" 15 r
          "$events" shortcut "$venus_pid" 9
          printf '%b' 'Aé界rrpaste-é界\n' > "$proof_dir/expected-input"
          for _ in {1..30}; do
            test -f "$input" && test "$(stat -f%z "$input")" -eq 20 && break
            kill -0 "$venus_pid"
            sleep 1
          done
          cmp "$proof_dir/expected-input" "$input"

          "$events" click "$venus_pid" "$center_x" "$center_y"
          "$events" move "$venus_pid" "$center_x" "$center_y"
          sleep 1
          "$events" command-click "$venus_pid" "$center_x" "$center_y"
          for _ in {1..30}; do
            grep -Fq 'GET /venus-proof?source=venus ' "$http_log" && break
            kill -0 "$venus_pid"
            sleep 1
          done
          grep -F 'GET /venus-proof?source=venus ' "$http_log"

          kill "$control_pid"
          control_pid=
          set +e
          wait "$venus_pid"
          status=$?
          set -e
          venus_pid=
          test "$status" -eq 0
          kill -0 "$orbit_pid"

      - name: Retain native observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: venus-macos-native-interaction
          path: ${{ runner.temp }}/venus-interaction
          if-no-files-found: ignore
          retention-days: 1
