name: Prove opaque Apple Silicon foundation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venus-opaque-apple-silicon
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      VENUS_SOURCE: af3804a890ce4898f1ebd75eccf44075fc063559
    steps:
      - name: Check out exact Venus candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VENUS_SOURCE }}
          persist-credentials: false

      - name: Check out exact Eon protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon
          ref: 0cc8f477298681ae3945903e8fdb5852d487c5ab
          path: .proof-deps/eon
          ssh-key: ${{ secrets.VENUS_PROOF_EON_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out exact Orbit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon-sessions
          ref: ea9fd28ce0908f218cf65d4e6df368f0a4e565f5
          path: .proof-deps/eon-sessions
          ssh-key: ${{ secrets.VENUS_PROOF_EON_SESSIONS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out accepted native Orbit runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon-sessions
          ref: 0233f4d34b294a50c5bc7f373859cf4ec04d2414
          path: .proof-deps/eon-sessions-runtime
          ssh-key: ${{ secrets.VENUS_PROOF_EON_SESSIONS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Pin private dependency fetches
        run: |
          test "$(git rev-parse HEAD)" = "$VENUS_SOURCE"
          test "$(git -C .proof-deps/eon rev-parse HEAD)" = 0cc8f477298681ae3945903e8fdb5852d487c5ab
          test "$(git -C .proof-deps/eon-sessions rev-parse HEAD)" = ea9fd28ce0908f218cf65d4e6df368f0a4e565f5
          test "$(git -C .proof-deps/eon-sessions-runtime rev-parse HEAD)" = 0233f4d34b294a50c5bc7f373859cf4ec04d2414
          git config --global url."file://$GITHUB_WORKSPACE/.proof-deps/eon".insteadOf https://github.com/Yazelix/eon.git
          git config --global url."file://$GITHUB_WORKSPACE/.proof-deps/eon-sessions".insteadOf https://github.com/Yazelix/eon-sessions.git

      - name: Install Zig 0.15.2 for Orbit
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          printf '%s  %s\n' \
            '3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b' \
            "$RUNNER_TEMP/zig.tar.xz" | shasum --algorithm 256 --check
          tar --extract --xz --file "$RUNNER_TEMP/zig.tar.xz" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"

      - name: Check the Apple target
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          rustc --version --verbose
          cargo --version --verbose
          zig version
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 > /dev/null
          cargo tree --locked --target aarch64-apple-darwin > "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F "accesskit_macos v0.26.3" "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F "glyphon v0.12.0" "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F "wgpu-core-deps-apple v30.0.1" "$RUNNER_TEMP/venus-apple-tree.txt"
          if grep -Eq "wayland-client|wl-clipboard-rs" "$RUNNER_TEMP/venus-apple-tree.txt"; then
            exit 1
          fi
          cargo check --locked --workspace --all-targets --target aarch64-apple-darwin
          cargo build --locked --bin yazelix-venus --target aarch64-apple-darwin

      - name: Build accepted Orbit producer
        run: cargo build --locked --manifest-path .proof-deps/eon-sessions-runtime/Cargo.toml --bin yazelix-orbit

      - name: Exercise default attachment through AppKit and Metal
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/venus-proof"
          install -d -m 700 "$proof_dir"
          uid=$(/usr/bin/id -u)
          socket="/tmp/yazelix-orbit-$uid/orbit.sock"
          control="$proof_dir/venus-control"
          log="$proof_dir/venus.log"
          screenshot="$proof_dir/venus-macos.png"
          orbit=.proof-deps/eon-sessions-runtime/target/debug/yazelix-orbit
          venus=target/aarch64-apple-darwin/debug/yazelix-venus
          test ! -e "$socket"
          /usr/bin/env -u UID -u XDG_RUNTIME_DIR "$orbit" serve -- /bin/sh -c 'printf "\033[2J\033[HVENUS APPLE SILICON\nASCII 0123456789\nUnicode: café λ 界 🪐\n\033[31mred \033[32mgreen \033[34mblue\033[0m\n"; exec /bin/sleep 300' &
          orbit_pid=$!
          control_pid=
          venus_pid=
          cleanup() {
            test -z "$control_pid" || kill "$control_pid" 2>/dev/null || true
            test -z "$venus_pid" || kill "$venus_pid" 2>/dev/null || true
            kill "$orbit_pid" 2>/dev/null || true
            wait "$orbit_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            test -S "$socket" && break
            kill -0 "$orbit_pid"
            sleep 1
          done
          test -S "$socket"
          mkfifo "$control"
          sleep 300 > "$control" &
          control_pid=$!
          /usr/bin/env -u UID -u XDG_RUNTIME_DIR EON_VENUS_PRESENTATION_CONTROL=stdin-ready-v1 "$venus" --columns 84 --rows 27 < "$control" > "$log" 2>&1 &
          venus_pid=$!
          for _ in {1..30}; do
            grep -Fq ready-v1 "$log" && break
            kill -0 "$venus_pid"
            sleep 1
          done
          grep -Fq ready-v1 "$log"
          sleep 2
          window_id=
          for _ in {1..30}; do
            # shellcheck disable=SC2016
            window_id=$(VENUS_PID="$venus_pid" swift -e 'import CoreGraphics; import Foundation; let pid = Int32(ProcessInfo.processInfo.environment["VENUS_PID"]!)!; let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)! as! [[String: Any]]; if let window = windows.first(where: { ($0[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == pid && ($0[kCGWindowLayer as String] as? NSNumber)?.intValue == 0 }), let number = window[kCGWindowNumber as String] as? NSNumber { print(number.intValue) }' 2>/dev/null)
            test -n "$window_id" && break
            sleep 1
          done
          test -n "$window_id"
          screencapture -x -l "$window_id" "$screenshot"
          sips -g pixelWidth -g pixelHeight "$screenshot"
          test "$(stat -f%z "$screenshot")" -gt 10000
          kill "$control_pid"
          control_pid=
          set +e
          wait "$venus_pid"
          status=$?
          set -e
          venus_pid=
          test "$status" -eq 0
          kill -0 "$orbit_pid"

      - name: Retain native screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: venus-opaque-apple-silicon
          path: ${{ runner.temp }}/venus-proof/venus-macos.png
          if-no-files-found: error
          retention-days: 1
