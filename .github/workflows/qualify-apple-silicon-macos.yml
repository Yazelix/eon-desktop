name: Qualify Apple Silicon macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venus-apple-silicon-qualification
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify current Venus stack
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out Venus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Eon protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon
          ref: 0cc8f477298681ae3945903e8fdb5852d487c5ab
          path: .qualification-deps/eon
          ssh-key: ${{ secrets.VENUS_QUALIFY_EON_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out exact Orbit protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yazelix/eon-sessions
          ref: ea9fd28ce0908f218cf65d4e6df368f0a4e565f5
          path: .qualification-deps/eon-sessions
          ssh-key: ${{ secrets.VENUS_QUALIFY_EON_SESSIONS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Pin private dependency fetches to the checked-out revisions
        run: |
          test "$(git -C .qualification-deps/eon rev-parse HEAD)" = +            0cc8f477298681ae3945903e8fdb5852d487c5ab
          test "$(git -C .qualification-deps/eon-sessions rev-parse HEAD)" = +            ea9fd28ce0908f218cf65d4e6df368f0a4e565f5
          git config --global +            url."file://$GITHUB_WORKSPACE/.qualification-deps/eon".insteadOf +            https://github.com/Yazelix/eon.git
          git config --global +            url."file://$GITHUB_WORKSPACE/.qualification-deps/eon-sessions".insteadOf +            https://github.com/Yazelix/eon-sessions.git

      - name: Record native environment
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          rustc --version --verbose
          cargo --version --verbose
          git rev-parse HEAD

      - name: Capture the unmodified locked failure
        run: |
          set +e
          cargo check --locked --workspace --all-targets +            > "$RUNNER_TEMP/venus-baseline.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/venus-baseline.log"
          test "$status" -ne 0
          grep -F "Venus supports only Linux" "$RUNNER_TEMP/venus-baseline.log"

      - name: Apply the disposable qualification patch
        run: |
          git apply --check .github/qualification/apple-silicon-macos.patch
          git apply .github/qualification/apple-silicon-macos.patch
          cargo fmt --all -- --check
          git diff --check
          git diff --stat

      - name: Check the patched Apple target
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo tree --locked --target aarch64-apple-darwin +            > "$RUNNER_TEMP/venus-apple-tree.txt"
          cat "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F "accesskit_macos v0.26.3" "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F "glyphon v0.12.0" "$RUNNER_TEMP/venus-apple-tree.txt"
          grep -F "wgpu-core-deps-apple v30.0.1" "$RUNNER_TEMP/venus-apple-tree.txt"
          ! grep -E "wayland-client|wl-clipboard-rs" +            "$RUNNER_TEMP/venus-apple-tree.txt"
          cargo check --locked --workspace --all-targets +            --target aarch64-apple-darwin
          cargo build --locked --bin yazelix-venus +            --target aarch64-apple-darwin

      - name: Open AppKit window with Metal and AccessKit
        run: |
          log="$RUNNER_TEMP/venus-native-smoke.log"
          ./target/aarch64-apple-darwin/debug/yazelix-venus +            "$RUNNER_TEMP/missing-orbit.sock" > "$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          qualified=false
          for _ in {1..30}; do
            if grep -Fq "VENUS_QUALIFICATION native_window=appkit" "$log" &&
              grep -Fq "VENUS_QUALIFICATION accesskit=initialized" "$log" &&
              grep -Fq "VENUS_QUALIFICATION gpu_backend=Metal" "$log" &&
              grep -Fq "VENUS_QUALIFICATION surface=configured" "$log" &&
              grep -Fq "VENUS_QUALIFICATION window=visible" "$log"; then
              qualified=true
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat "$log"
          test "$qualified" = true
